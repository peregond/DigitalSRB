<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE0EA"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="s" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#111" flood-opacity=".15"/></filter>
</defs>
<style>
.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.da{stroke-dasharray:7 9;animation:da 1.2s linear infinite}
.pu{animation:pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wv{animation:wv 2.4s ease-in-out infinite}.wv2{animation:wv 2.4s ease-in-out .4s infinite}.wv3{animation:wv 2.4s ease-in-out .8s infinite}
.sw{animation:sw 6s ease-in-out infinite;transform-origin:200px 76px}
.ch{animation:ch 2s ease-in-out infinite}.ch2{animation:ch 2s ease-in-out .3s infinite}.ch3{animation:ch 2s ease-in-out .6s infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes da{to{stroke-dashoffset:-16}}
@keyframes pu{50%{transform:scale(1.18);opacity:.55}}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ch{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="350" cy="30" r="70" fill="#24407A" opacity=".08"/><circle cx="30" cy="285" r="80" fill="#24407A" opacity=".08"/>

<g class="fl"><circle cx="200" cy="46" r="28" fill="none" stroke="#111" stroke-width="7"/><circle cx="200" cy="46" r="7" fill="#24407A"/>
<path d="M200 46v28M200 46l-24-10M200 46l24-10" stroke="#111" stroke-width="6" stroke-linecap="round" fill="none"/></g>
<g class="fl2"><rect x="30" y="104" width="136" height="92" rx="12" fill="#fff" stroke="#111" stroke-width="4.5" filter="url(#s)"/>
<rect x="30" y="104" width="136" height="22" rx="12" fill="#D9D5CF"/><rect x="30" y="116" width="136" height="10" fill="#D9D5CF"/>
<rect x="44" y="138" width="38" height="44" rx="6" fill="#D9D5CF"/>
<rect x="94" y="140" width="58" height="8" rx="4" fill="#D9D5CF"/><rect x="94" y="156" width="44" height="8" rx="4" fill="#D9D5CF"/><rect x="94" y="172" width="50" height="8" rx="4" fill="#D9D5CF"/></g>
<path class="da" d="M176 152H206" stroke="#24407A" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M200 140l14 12-14 12" fill="none" stroke="#24407A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="fl"><rect x="224" y="96" width="146" height="104" rx="12" fill="#fff" stroke="#111" stroke-width="4.5" filter="url(#s)"/>
<rect x="224" y="96" width="146" height="26" rx="12" fill="#24407A"/><rect x="224" y="110" width="146" height="12" fill="#24407A"/>
<rect x="238" y="134" width="38" height="46" rx="6" fill="#DCE0EA"/><circle cx="257" cy="152" r="8" fill="#24407A" opacity=".5"/>
<rect x="288" y="136" width="62" height="8" rx="4" fill="#D9D5CF"/><rect x="288" y="152" width="46" height="8" rx="4" fill="#D9D5CF"/><rect x="288" y="168" width="54" height="8" rx="4" fill="#D9D5CF"/>
<circle cx="362" cy="196" r="20" fill="#12A150"/><path d="M353.6 196.4l5.6 6.0 11.2-12.0" fill="none" stroke="#fff" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
