<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DBE8FC"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="s" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#111" flood-opacity=".15"/></filter>
</defs>
<style>
.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 6.5s ease-in-out -2s infinite}
.da{stroke-dasharray:7 9;animation:da 1.2s linear infinite}
.pu{animation:pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wv{animation:wv 2.4s ease-in-out infinite}.wv2{animation:wv 2.4s ease-in-out .4s infinite}.wv3{animation:wv 2.4s ease-in-out .8s infinite}
.sw{animation:sw 6s ease-in-out infinite;transform-origin:200px 76px}
.ch{animation:ch 2s ease-in-out infinite}.ch2{animation:ch 2s ease-in-out .3s infinite}.ch3{animation:ch 2s ease-in-out .6s infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes da{to{stroke-dashoffset:-16}}
@keyframes pu{50%{transform:scale(1.18);opacity:.55}}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ch{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="350" cy="30" r="70" fill="#1F6FEB" opacity=".08"/><circle cx="30" cy="285" r="80" fill="#1F6FEB" opacity=".08"/>

<g class="fl"><rect x="96" y="58" width="208" height="186" rx="22" fill="#fff" filter="url(#s)"/>
<path d="M96 80a22 22 0 0 1 22-22h164a22 22 0 0 1 22 22v24H96z" fill="#1F6FEB"/>
<rect x="128" y="44" width="9" height="26" rx="4.5" fill="#111"/><rect x="263" y="44" width="9" height="26" rx="4.5" fill="#111"/>
<circle cx="132" cy="130" r="5" fill="#D9D5CF"/><circle cx="166" cy="130" r="5" fill="#D9D5CF"/><circle cx="200" cy="130" r="5" fill="#D9D5CF"/><circle cx="234" cy="130" r="5" fill="#D9D5CF"/><circle cx="268" cy="130" r="5" fill="#D9D5CF"/><circle cx="132" cy="164" r="5" fill="#D9D5CF"/><circle cx="166" cy="164" r="5" fill="#D9D5CF"/><circle cx="234" cy="164" r="5" fill="#D9D5CF"/><circle cx="268" cy="164" r="5" fill="#D9D5CF"/><circle cx="132" cy="198" r="5" fill="#D9D5CF"/><circle cx="166" cy="198" r="5" fill="#D9D5CF"/><circle cx="200" cy="198" r="5" fill="#D9D5CF"/><circle cx="234" cy="198" r="5" fill="#D9D5CF"/><circle cx="268" cy="198" r="5" fill="#D9D5CF"/>
<circle class="pu" cx="200" cy="164" r="17" fill="#1F6FEB" opacity=".2"/><circle cx="200" cy="164" r="14" fill="#1F6FEB"/><path d="M194.1 164.3l3.9 4.2 7.8-8.4" fill="none" stroke="#fff" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fl2"><circle cx="300" cy="226" r="32" fill="#111" filter="url(#s)"/>
<circle cx="300" cy="226" r="17" fill="none" stroke="#fff" stroke-width="5"/><path d="M300 215v22M293 222h10a4 4 0 0 1 0 8h-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>

</svg>
